# TLS termination for private-subnet deployments (no ALB).
# Usage: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Certs are issued on the host: certbot certonly --dns-route53 -d <domain>
# deploy/*.conf holds one server block per protected app.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '443:443'
      # Public gatehouse-only listener (NLB TCP:443 → :8443); see deploy/auth-public.conf
      - '8443:8443'
    volumes:
      - ./deploy:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gatehouse
    networks:
      - default
      - redash
      - pgsearch
      - vault
      - lookout
      - mailroom
      - lobby
      - notebook
      - ward
      - forager
    restart: unless-stopped

  # 제로트러스트: gatehouse 가 ward 컨테이너(/api/zt/posture)를 직접 부른다(nginx 를 거치면 SSO 벽에 걸린다).
  gatehouse:
    networks:
      - default
      - ward

networks:
  # Join each app's compose network so their ports never need host exposure.
  redash:
    external: true
    name: redash_default
  pgsearch:
    external: true
    name: pgsearch_default
  vault:
    external: true
    name: vault_vault-network
  lookout:
    external: true
    name: lookout_default
  mailroom:
    external: true
    name: mailroom_default
  lobby:
    external: true
    name: lobby_default
  notebook:
    external: true
    name: notebook_default
  ward:
    external: true
    name: ward_default
  # search.datasee.co.kr (deploy/forager-public.conf) 가 forager:9300 을 proxy_pass 한다.
  forager:
    external: true
    name: forager_default

