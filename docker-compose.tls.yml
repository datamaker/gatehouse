# TLS termination for private-subnet deployments (no ALB).
# Usage: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Certs are issued on the host: certbot certonly --dns-route53 -d <domain>
# deploy/*.conf holds one server block per protected app.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '443:443'
      # Public gatehouse-only listener (NLB TCP:443 → :8443); see deploy/auth-public.conf
      - '8443:8443'
    volumes:
      - ./deploy:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 저장소에 넣지 않는 nginx 조각(프록시 공유 시크릿). 없으면 include 가 조용히 빈다 → 앱이 X-Auth-* 를 안 믿는다.
      - ./secrets:/etc/nginx/secrets:ro
    depends_on:
      - gatehouse
    networks:
      # 호스트로 나갈 때(VPN 패널 11.0.1.21:8080)의 출발 주소를 gatehouse 네트워크로 고정한다. 지정하지 않으면
      # 이름순 첫 네트워크(census_default)로 나가 방화벽·신뢰 대역을 예측할 수 없다(2026-11-13 패널 접속 차단 사고).
      default:
        gw_priority: 100
      redash:
      pgsearch:
      vault:
      lookout:
      mailroom:
      lobby:
      notebook:
      ward:
      forager:
      census:
    restart: unless-stopped

  # 제로트러스트: gatehouse 가 ward 컨테이너(/api/zt/posture)를 직접 부른다(nginx 를 거치면 SSO 벽에 걸린다).
  gatehouse:
    networks:
      - default
      - ward

networks:
  # Join each app's compose network so their ports never need host exposure.
  redash:
    external: true
    name: redash_default
  pgsearch:
    external: true
    name: pgsearch_default
  vault:
    external: true
    name: vault_vault-network
  lookout:
    external: true
    name: lookout_default
  mailroom:
    external: true
    name: mailroom_default
  lobby:
    external: true
    name: lobby_default
  notebook:
    external: true
    name: notebook_default
  ward:
    external: true
    name: ward_default
  # search.datasee.co.kr (deploy/forager-public.conf) 가 forager:9300 을 proxy_pass 한다.
  forager:
    external: true
    name: forager_default
  # census.datasee.co.kr (deploy/census.conf) 가 census:9700 을 proxy_pass 한다.
  census:
    external: true
    name: census_default
