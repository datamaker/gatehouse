services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatehouse}
      POSTGRES_DB: gatehouse
    volumes:
      - gatehouse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatehouse']
      interval: 5s
      timeout: 3s
      retries: 10
    # DB 가 죽으면 앱도 같이 멈춘다 — 재시작 정책을 반드시 건다.
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  gatehouse:
    build: .
    ports:
      - '${PORT:-9100}:9100'
    environment:
      DATABASE_URL: postgres://gatehouse:${POSTGRES_PASSWORD:-gatehouse}@postgres:5432/gatehouse
      GATEHOUSE_PUBLIC_URL: ${GATEHOUSE_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GATEHOUSE_ALLOWED_DOMAINS: ${GATEHOUSE_ALLOWED_DOMAINS:-datasee.co.kr}
      GATEHOUSE_COOKIE_DOMAIN: ${GATEHOUSE_COOKIE_DOMAIN:-}
      GATEHOUSE_COOKIE_SECRET: ${GATEHOUSE_COOKIE_SECRET:-}
      GATEHOUSE_SESSION_IDLE_HOURS: ${GATEHOUSE_SESSION_IDLE_HOURS:-24}
      GATEHOUSE_SESSION_MAX_HOURS: ${GATEHOUSE_SESSION_MAX_HOURS:-168}
      GATEHOUSE_SESSION_TOUCH_MINUTES: ${GATEHOUSE_SESSION_TOUCH_MINUTES:-10}
      GATEHOUSE_ADMIN_EMAILS: ${GATEHOUSE_ADMIN_EMAILS:-}
      # 제로트러스트(ward 디바이스 상태 판정). compose 는 여기 적은 변수만 컨테이너에 넘긴다 — .env 에만 넣으면 안 간다.
      GATEHOUSE_ZT_MODE: ${GATEHOUSE_ZT_MODE:-off}
      GATEHOUSE_WARD_URL: ${GATEHOUSE_WARD_URL:-http://ward:9600}
      GATEHOUSE_WARD_SECRET: ${GATEHOUSE_WARD_SECRET:-}
      GATEHOUSE_WARD_PUBLIC_URL: ${GATEHOUSE_WARD_PUBLIC_URL:-https://ward.datasee.co.kr}
      GATEHOUSE_ZT_FAIL_OPEN: ${GATEHOUSE_ZT_FAIL_OPEN:-true}
      GATEHOUSE_ZT_CACHE_SEC: ${GATEHOUSE_ZT_CACHE_SEC:-60}
      GATEHOUSE_ZT_TIMEOUT_MS: ${GATEHOUSE_ZT_TIMEOUT_MS:-1000}
      GATEHOUSE_ZT_EXEMPT_EMAILS: ${GATEHOUSE_ZT_EXEMPT_EMAILS:-}
      GATEHOUSE_ZT_EXEMPT_HOSTS: ${GATEHOUSE_ZT_EXEMPT_HOSTS:-}
      # 막지 않고 제한: enforce 에서 거부될 판정이어도 통과 + X-Auth-Device-Restricted: 1 (ward 콘솔용)
      GATEHOUSE_ZT_SOFT_HOSTS: ${GATEHOUSE_ZT_SOFT_HOSTS:-}
      # 전역이 monitor 여도 이 사용자들만 enforce (단계적 전환용)
      GATEHOUSE_ZT_ENFORCE_EMAILS: ${GATEHOUSE_ZT_ENFORCE_EMAILS:-}
      GATEHOUSE_ZT_OIDC_EXEMPT_CLIENTS: ${GATEHOUSE_ZT_OIDC_EXEMPT_CLIENTS:-}
      # 앱들이 계정 상태(/internal/account)를 물을 때 쓰는 공유 시크릿. 없으면 라우트가 없다.
      GATEHOUSE_INTERNAL_SECRET: ${GATEHOUSE_INTERNAL_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

volumes:
  gatehouse-pgdata:
