# secret-vault web console behind gatehouse (outer wall; vault's own JWT
# login remains inside). The web container's internal nginx already proxies
# /api to the backend, so one upstream covers UI + API without CORS.
# The raw API port :3000 stays published on the host for CLI/secret-fetcher
# (JWT-protected); only the web port is closed to 127.0.0.1.
server {
  listen 443 ssl;
  http2 on;
  server_name vault.datasee.co.kr;
  include /etc/nginx/conf.d/snippets/path-guard.conf;

  ssl_certificate /etc/letsencrypt/live/vault.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vault.datasee.co.kr/privkey.pem;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header X-Forwarded-Host $host;   # 제로트러스트 기록·면제용(어느 앱인지)
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;   # 브라우저가 보낸 XFF 는 버린다 — 제로트러스트 기기 IP 사칭 방지
    proxy_set_header Content-Length "";
  }

  # API is JWT-protected by the backend itself — no gatehouse wall, so the
  # CLI (`vault login --api-url https://vault.datasee.co.kr`) works over VPN.
  # The OIDC callback also lives under /api and validates its own state.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream_api http://vault:3000;
    proxy_pass $upstream_api;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    auth_request /_gatehouse/verify;
    error_page 401 = @login;
    auth_request_set $zt_denied_v $upstream_http_x_auth_denied;          # 거부 사유를 안내 페이지로 넘긴다
    auth_request_set $zt_denied_r $upstream_http_x_auth_denied_reason;
    error_page 403 = @zt_denied;   # 기기·앱 접근 거부 안내(gatehouse /auth/denied)

    resolver 127.0.0.11 valid=10s;
    set $upstream http://vault:3000;
    proxy_pass $upstream;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }

  include /etc/nginx/conf.d/snippets/zt-denied.conf;
}
