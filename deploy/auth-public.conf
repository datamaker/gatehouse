# Public-facing listener for gatehouse ONLY, fronted by the NLB (TCP :443 →
# instance :8443). Kept on a separate port so the internal vhosts on :443
# (redash, vault, lookout, pgsearch) are never reachable from the internet —
# whatever SNI/Host a public client sends, this block serves only gatehouse.
server {
  listen 8443 ssl default_server;
  http2 on;
  server_name auth.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/auth.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth.datasee.co.kr/privkey.pem;

  location / {
    proxy_pass http://gatehouse:9100;
    proxy_set_header Host auth.datasee.co.kr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
