# Public-facing listener for gatehouse ONLY, fronted by the NLB (TCP :443 →
# instance :8443). Kept on a separate port so the internal vhosts on :443
# (redash, vault, lookout, pgsearch) are never reachable from the internet —
# whatever SNI/Host a public client sends, this block serves only gatehouse.
# NLB preserves the real client IP, so per-IP limiting works as expected.
limit_req_zone $binary_remote_addr zone=gh_public:10m rate=10r/s;

server {
  listen 8443 ssl default_server;
  http2 on;
  server_name auth.datasee.co.kr;

  # Generous enough for the multi-redirect OIDC dance, tight enough to blunt
  # scanners and brute-force attempts on the public listener.
  limit_req zone=gh_public burst=30 nodelay;
  limit_req_status 429;

  ssl_certificate /etc/letsencrypt/live/auth.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth.datasee.co.kr/privkey.pem;

  # Vulnerability scanners probe for leftover config/backup/script files; the
  # SPA catch-all used to answer 200 for every one of them, which reads as a
  # "hit" and invites follow-up attacks. Answer 404 here so probes never reach
  # gatehouse. Suffix part also catches mangled variants (.crt~, .log~~.save,
  # .env.bak). Asset types the SPA serves (.js .css .map .json .svg .png .ico
  # .woff2) are deliberately absent from the list.
  location ~* \.(php\d?|phtml|asp|aspx|jsp|jspx|cgi|env|bak|backup|old|orig|save|swp|sql|sqlite|db|ini|conf(ig)?|log|yml|yaml|toml|pem|key|crt|csr|p12|json5?|xml|pwd|htpasswd|sh|bat|ps1|tar|gz|tgz|zip|rar|7z)([.~][\w.~]*)?$ {
    return 404;
  }

  # Dotfiles (/.env, /.git/…). /.well-known stays reachable — OIDC discovery
  # lives at /oidc/.well-known/openid-configuration.
  location ~ /\.(?!well-known) {
    return 404;
  }

  # Extensionless scanner buckets that would otherwise fall through to the SPA
  # catch-all and answer 200 (which a scanner reads as a "hit"). None are real
  # routes on an SSO page. Logged, so fail2ban counts the probes.
  location ~* ^/(actuator|_vti_pvt|_vti_bin|_vti_inf|server-status|server-info|wp-admin|wp-content|wp-includes|wp-json|wordpress|xmlrpc|cgi-bin|jenkins|solr|struts2?|phpmyadmin|pma|adminer|owncloud|autodiscover)(/|$) {
    return 404;
  }
  location ~* ^/(secrets|user_secrets|credentials|aws|gcp|kube|dbeaver)(\.|/|$) {
    return 404;
  }

  location / {
    # Re-resolve the compose DNS name so a gatehouse-container restart (new
    # IP) doesn't leave nginx 502ing at a cached address.
    resolver 127.0.0.11 valid=10s;
    set $gatehouse gatehouse:9100;
    proxy_pass http://$gatehouse;
    proxy_set_header Host auth.datasee.co.kr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
