# 사내 노트 (notebook). gatehouse 의 deploy/ 로 옮겨 nginx 가 읽게 한다.
# nginx 는 notebook_default 네트워크에 붙어야 한다(docker-compose.tls.yml 의 networks).
map $http_upgrade $nb_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  http2 on;
  server_name note.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/note.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/note.datasee.co.kr/privkey.pem;

  # 첨부 업로드 한도(앱 NOTEBOOK_FILE_MAX_MB 기본 25MB)보다 조금 크게.
  client_max_body_size 30m;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # 실시간 공동 편집. WebSocket 업그레이드 요청에도 gatehouse 확인을 똑같이 건다.
  location /collab {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    error_page 401 = @unauth;

    proxy_set_header X-Auth-Email $auth_email;
    proxy_set_header X-Auth-Name $auth_name;

    resolver 127.0.0.11 valid=10s;
    set $collab http://notebook:9501;
    proxy_pass $collab;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nb_connection_upgrade;
    proxy_set_header Host $host;
    # 편집 창을 띄워 둔 채 오래 있어도 끊기지 않게(클라이언트가 주기적으로 핑을 보낸다).
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    error_page 401 = @login;

    # 덮어쓴다(set) — 클라이언트가 보낸 X-Auth-* 는 앱까지 가지 못한다.
    proxy_set_header X-Auth-Email $auth_email;
    proxy_set_header X-Auth-Name $auth_name;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://notebook:9500;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }

  location @unauth {
    return 401;
  }
}
