# Redash behind gatehouse forward-auth.
# Requires: nginx joined to the redash_default docker network (docker-compose.tls.yml),
# a cert at /etc/letsencrypt/live/redash.datasee.co.kr, and in redash .env:
#   REDASH_REMOTE_USER_LOGIN_ENABLED=true
server {
  listen 443 ssl;
  http2 on;
  server_name redash.datasee.co.kr;
  include /etc/nginx/conf.d/snippets/path-guard.conf;

  ssl_certificate /etc/letsencrypt/live/redash.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/redash.datasee.co.kr/privkey.pem;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header X-Forwarded-Host $host;   # 제로트러스트 기록·면제용(어느 앱인지)
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;   # 브라우저가 보낸 XFF 는 버린다 — 제로트러스트 기기 IP 사칭 방지
    proxy_set_header Content-Length "";
  }

  # This Redash version renders its login page instead of auto-redirecting to
  # remote-user auth, so send /login straight there (it sits behind auth like
  # everything else, so unauthenticated users still bounce to gatehouse).
  location = /login {
    return 302 /remote_user/login?next=$arg_next;
  }

  # Redash validates its own API keys (Authorization: Key ... or ?api_key=),
  # so key-bearing API requests skip the SSO gate; Redash rejects bad keys itself.
  location /api/ {
    error_page 418 = @redash_api_key;
    if ($http_authorization ~* "^Key ") { return 418; }
    if ($arg_api_key != "") { return 418; }

    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    proxy_set_header X-Forwarded-Remote-User $auth_email;

    error_page 401 = @login;
    error_page 403 = @zt_denied;   # 기기·앱 접근 거부 안내(gatehouse /auth/denied)

    resolver 127.0.0.11 valid=10s;
    set $redash http://redash-server-1:5000;
    proxy_pass $redash;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location @redash_api_key {
    # No SSO header here — never forward a client-supplied remote-user value.
    proxy_set_header X-Forwarded-Remote-User "";

    resolver 127.0.0.11 valid=10s;
    set $redash http://redash-server-1:5000;
    proxy_pass $redash;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;

    # Redash trusts this header for login; always overwrite so clients can't spoof it.
    proxy_set_header X-Forwarded-Remote-User $auth_email;

    error_page 401 = @login;
    error_page 403 = @zt_denied;   # 기기·앱 접근 거부 안내(gatehouse /auth/denied)

    resolver 127.0.0.11 valid=10s;
    set $redash http://redash-server-1:5000;
    proxy_pass $redash;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }

  include /etc/nginx/conf.d/snippets/zt-denied.conf;
}
