# Redash behind gatehouse forward-auth.
# Requires: nginx joined to the redash_default docker network (docker-compose.tls.yml),
# a cert at /etc/letsencrypt/live/redash.datasee.co.kr, and in redash .env:
#   REDASH_REMOTE_USER_LOGIN_ENABLED=true
server {
  listen 443 ssl;
  http2 on;
  server_name redash.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/redash.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/redash.datasee.co.kr/privkey.pem;

  location = /_gatehouse/verify {
    internal;
    proxy_pass http://gatehouse:9100/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # This Redash version renders its login page instead of auto-redirecting to
  # remote-user auth, so send /login straight there (it sits behind auth like
  # everything else, so unauthenticated users still bounce to gatehouse).
  location = /login {
    return 302 /remote_user/login?next=$arg_next;
  }

  location / {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;

    # Redash trusts this header for login; always overwrite so clients can't spoof it.
    proxy_set_header X-Forwarded-Remote-User $auth_email;

    error_page 401 = @login;

    resolver 127.0.0.11 valid=10s;
    set $redash http://redash-server-1:5000;
    proxy_pass $redash;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }
}
