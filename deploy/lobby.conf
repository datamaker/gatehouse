# 사내 포털 (lobby). gatehouse 의 deploy/ 로 옮겨 nginx 가 읽게 한다.
# nginx 는 lobby_default 네트워크에 붙어야 한다(docker-compose.tls.yml 의 networks).
server {
  listen 443 ssl;
  http2 on;
  server_name in.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/in.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/in.datasee.co.kr/privkey.pem;

  client_max_body_size 2m;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location / {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    error_page 401 = @login;

    # 덮어쓴다(set) — 클라이언트가 보낸 X-Auth-* 는 앱까지 가지 못한다.
    proxy_set_header X-Auth-Email $auth_email;
    proxy_set_header X-Auth-Name $auth_name;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://lobby:9400;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }
}
