# OpenTunnel VPN admin panel behind gatehouse.
#
# The panel is host-networked on the VPN server (port 8080), so the upstream is
# the host address rather than a compose service name. Reachable over the VPN
# only: vpn-admin.datasee.co.kr resolves to the private 11.0.1.21, like the
# other internal tools.
#
# gatehouse is the only login step. The verified address is passed upstream as
# X-Auth-Email, and the panel exchanges it for a session via
# /api/login/forward-auth — which is why it must never be forwarded from the
# client. Requires on the VPN server:
#   ADMIN_SSO_EMAILS=...            who is allowed in
#   ADMIN_TRUSTED_PROXIES=<nginx>   whose X-Auth-Email is believed
server {
  listen 443 ssl;
  http2 on;
  server_name vpn-admin.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/vpn-admin.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vpn-admin.datasee.co.kr/privkey.pem;

  location = /_gatehouse/verify {
    internal;
    proxy_pass http://gatehouse:9100/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location / {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    error_page 401 = @login;

    # Set (not added) from the auth_request result, so a client-supplied
    # X-Auth-Email is always overwritten and never reaches the panel.
    proxy_set_header X-Auth-Email $auth_email;

    proxy_pass http://11.0.1.21:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }
}
