server {
  listen 443 ssl;
  http2 on;
  server_name auth.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/auth.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth.datasee.co.kr/privkey.pem;

  location / {
    proxy_pass http://gatehouse:9100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
