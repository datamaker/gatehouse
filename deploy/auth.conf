server {
  listen 443 ssl;
  http2 on;
  server_name auth.datasee.co.kr;
  include /etc/nginx/conf.d/snippets/path-guard.conf;

  ssl_certificate /etc/letsencrypt/live/auth.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth.datasee.co.kr/privkey.pem;

  # 관리 콘솔은 내부 전용 호스트(gatehouse.datasee.co.kr, deploy/gatehouse.conf)로 옮겼다. 이 호스트에서는 관리 API 를
  # 내주지 않고, 콘솔 주소로 오면 새 주소로 보낸다.
  location /api/admin/ { return 404; }
  location /admin { return 302 https://gatehouse.datasee.co.kr$request_uri; }

  location / {
    # Re-resolve the compose DNS name so a gatehouse-container restart (new
    # IP) doesn't leave nginx 502ing at a cached address.
    resolver 127.0.0.11 valid=10s;
    set $gatehouse gatehouse:9100;
    proxy_pass http://$gatehouse;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
