# 엔드포인트 보안 콘솔 (ward). gatehouse 의 deploy/ 로 옮겨 nginx 가 읽게 한다.
# nginx 는 ward_default 네트워크에 붙어야 한다(docker-compose.tls.yml 의 networks).
server {
  listen 443 ssl;
  http2 on;
  server_name ward.datasee.co.kr;
  include /etc/nginx/conf.d/snippets/path-guard.conf;

  ssl_certificate /etc/letsencrypt/live/ward.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ward.datasee.co.kr/privkey.pem;

  client_max_body_size 4m;   # 에이전트 백업 업로드(/agent/backups)는 아래 location 에서 250m 로 올린다

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header X-Forwarded-Host $host;   # 제로트러스트 기록·면제용(어느 앱인지)
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;   # 브라우저가 보낸 XFF 는 버린다 — 제로트러스트 기기 IP 사칭 방지
    proxy_set_header Content-Length "";
  }

  # 에이전트 경로: SSO 벽이 없다. X-Auth-* 를 비워서 넘기고, 앱은 Bearer wda_ 토큰만 본다.
  # /agent/… → 앱의 /api/agent/… (notebook 의 /cli/ 와 같은 방식)
  location /agent/ {
    client_max_body_size 250m;
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
    resolver 127.0.0.11 valid=10s;
    set $upstream_agent http://ward:9600;
    rewrite ^/agent/(.*)$ /api/agent/$1 break;
    proxy_pass $upstream_agent;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # 에이전트가 계약(docs/PROTOCOL.md)대로 /api/agent/… 를 직접 부른다. /agent/ 는 그 별칭이다.
  location /api/agent/ {
    client_max_body_size 250m;
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
    resolver 127.0.0.11 valid=10s;
    set $upstream_api_agent http://ward:9600;
    proxy_pass $upstream_api_agent;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/zt/ {
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
    resolver 127.0.0.11 valid=10s;
    set $upstream_api_zt http://ward:9600;
    proxy_pass $upstream_api_zt;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Santa 동기화: 에이전트 경로처럼 SSO 벽이 없다. 앱의 /santa/<디바이스 토큰>/… 로 그대로 넘긴다.
  location /santa/ {
    client_max_body_size 20m;
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
    resolver 127.0.0.11 valid=10s;
    set $upstream_santa http://ward:9600;
    proxy_pass $upstream_santa;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # 제로트러스트: gatehouse 가 서버 간으로 디바이스 상태를 묻는다(X-Ward-Secret). SSO 벽 없음.
  location /zt/ {
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
    resolver 127.0.0.11 valid=10s;
    set $upstream_zt http://ward:9600;
    rewrite ^/zt/(.*)$ /api/zt/$1 break;
    proxy_pass $upstream_zt;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /healthz {
    resolver 127.0.0.11 valid=10s;
    set $upstream_health http://ward:9600;
    proxy_pass $upstream_health;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
  }

  location / {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    error_page 401 = @login;
    auth_request_set $zt_denied_v $upstream_http_x_auth_denied;          # 거부 사유를 안내 페이지로 넘긴다
    auth_request_set $zt_denied_r $upstream_http_x_auth_denied_reason;
    error_page 403 = @zt_denied;   # 기기·앱 접근 거부 안내(gatehouse /auth/denied)

    # 덮어쓴다(set) — 클라이언트가 보낸 X-Auth-* 는 앱까지 가지 못한다.
    # 제한 접근: 기기가 미준수여도 gatehouse 가 이 콘솔은 열어 주되(소프트 호스트) 1 을 붙인다. 항상 덮어쓴다 —
    # 클라이언트가 보낸 같은 이름의 헤더가 앱에 닿으면 안 된다. ward 는 1 이면 "내 기기"만 보여 준다.
    auth_request_set $auth_restricted $upstream_http_x_auth_device_restricted;
    proxy_set_header X-Auth-Device-Restricted $auth_restricted;
    proxy_set_header X-Auth-Email $auth_email;
    proxy_set_header X-Auth-Name $auth_name;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://ward:9600;
    proxy_pass $upstream;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    include /etc/nginx/secrets/proxy-secret[.]conf;   # X-Proxy-Secret — 앱은 이 값이 맞을 때만 X-Auth-* 를 믿는다
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }

  include /etc/nginx/conf.d/snippets/zt-denied.conf;
}
