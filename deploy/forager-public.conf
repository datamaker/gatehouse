# search.datasee.co.kr — 외부 브랜드도 로그인하므로 인터넷 공개. mail.datasee.co.kr 과 같은 :8443 SNI 분기.
# 이 파일은 /opt/gatehouse/deploy/ 에 둔다 (gatehouse-nginx-1 의 /etc/nginx/conf.d 마운트).
# nginx 컨테이너는 docker-compose.tls.yml 의 networks 에 forager_default(external) 가 선언돼 있어 재생성해도 forager 스택에 붙는다 (수동 docker network connect 불필요).
# Route53: search.datasee.co.kr A alias → opentunnel-nlb. 인증서: certbot certonly --dns-route53 (갱신 훅이 nginx 를 재시작한다).
limit_req_zone $binary_remote_addr zone=forager_public:10m rate=20r/s;

server {
  listen 8443 ssl;
  http2 on;
  server_name search.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/search.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/search.datasee.co.kr/privkey.pem;

  client_max_body_size 10m;

  # 스캐너가 찔러대는 확장자는 앱까지 보내지 않는다 (auth-public.conf 와 같은 정책).
  location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|env|bak|sql|ini|log|yml|yaml|toml|pem|key|sh|tar|gz|zip|rar|7z)([.~][\w.~]*)?$ {
    return 404;
  }

  location / {
    limit_req zone=forager_public burst=40 nodelay;
    limit_req_status 429;
    resolver 127.0.0.11 valid=10s;
    set $upstream http://forager:9300;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }
}
