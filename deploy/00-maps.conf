# http 컨텍스트 공용 map (conf.d 는 http 블록 안에서 include 된다. 파일명 00- 으로 먼저 읽힌다).
#
# $app_cookie — 앱 업스트림으로 넘기는 Cookie 헤더. gatehouse SSO 세션 쿠키만 뺀다(2026-11-13).
# 쿠키가 Domain=datasee.co.kr 이라 브라우저는 모든 앱(인터넷 공개 앱 포함)에 SSO 세션을 보낸다. 그대로 넘기면
# 앱 하나만 뚫려도 직원의 SSO 세션을 가로채 auth.datasee.co.kr 에서 재사용할 수 있다. 앱은 X-Auth-* 헤더나
# 자기 세션만 쓰므로 이 쿠키가 필요 없다. /_gatehouse/verify 서브리퀘스트는 원본 Cookie 를 그대로 쓴다.
map $http_cookie $app_cookie {
  default $http_cookie;
  "~^(?<gh_c_pre>.*?)(?:;\s*)?(?:__Secure-)?gh_session=[^;]*(?<gh_c_post>.*)$" "$gh_c_pre$gh_c_post";
}
