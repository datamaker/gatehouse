# gatehouse 관리 콘솔 — 내부 전용(VPN) 호스트. 2026-11-13 에 auth.datasee.co.kr 에서 분리했다.
#
# auth.datasee.co.kr 은 인터넷에 열려 있어야 한다(로그인·OIDC·거부 안내). 관리 콘솔까지 거기 두면 관리자 세션만
# 있으면 어떤 기기·어떤 망에서든 사용자 비활성화·앱 정책·OIDC 클라이언트를 만질 수 있고, 기기 판정도 걸 수 없다
# (공인 주소로 들어와 에이전트가 보고한 VPN 주소와 맞지 않는다). 이 호스트는 11.0.1.21 로만 해석되고
# 다른 사내 앱처럼 forward-auth(세션 + 제로트러스트 + 앱 접근 정책)를 거친다.
server {
  listen 443 ssl;
  http2 on;
  server_name gatehouse.datasee.co.kr;
  include /etc/nginx/conf.d/snippets/path-guard.conf;

  ssl_certificate /etc/letsencrypt/live/gatehouse.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gatehouse.datasee.co.kr/privkey.pem;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
  }

  # 로그인·OIDC·거부 안내는 공개 호스트의 일이다. 여기로 오면 그쪽으로 보낸다(콘솔의 /login?rd=… 도 그대로 간다).
  # 로그아웃 폼(POST)은 303 으로 GET 확인 페이지에 보낸다 — 다른 오리진의 POST 는 gatehouse 가 거절한다.
  location = /logout { return 303 https://auth.datasee.co.kr/logout; }
  location ~ ^/(login|callback|oidc|oidc-interaction|auth|internal)(/|$) {
    return 302 https://auth.datasee.co.kr$request_uri;
  }
  location = /healthz {
    resolver 127.0.0.11 valid=10s;
    set $gh_health gatehouse:9100;
    proxy_pass http://$gh_health;
  }

  location / {
    auth_request /_gatehouse/verify;
    error_page 401 = @login;
    error_page 403 = @zt_denied;

    resolver 127.0.0.11 valid=10s;
    set $gatehouse gatehouse:9100;
    proxy_pass http://$gatehouse;
    # 업스트림이 gatehouse 자신이라 세션 쿠키를 그대로 넘긴다($app_cookie 로 빼지 않는다).
    proxy_set_header Host auth.datasee.co.kr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }
  include /etc/nginx/conf.d/snippets/zt-denied.conf;
}
