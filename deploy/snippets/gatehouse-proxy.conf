# gatehouse 업스트림 프록시 공통 조각. auth.conf / auth-public.conf 의 허용 경로들이 include 한다.
# Re-resolve the compose DNS name so a gatehouse-container restart (new IP) doesn't leave nginx 502ing.
resolver 127.0.0.11 valid=10s;
set $gatehouse gatehouse:9100;
proxy_pass http://$gatehouse;
proxy_set_header Host auth.datasee.co.kr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
