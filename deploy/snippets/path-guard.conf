# 경로 우회 방어선 (2026-11-13). 모든 server 블록이 include 한다.
#
# 내부 앱 여럿이 "원본 URL 이 /api/ 로 시작하는가"로 인증을 갈랐는데 라우터는 %61pi 를 api 로 풀고 ';' 뒤를
# 버려서, 인코딩한 첫 구간이나 `;x/../..` 로 인증 훅과 nginx location 화이트리스트를 함께 빠져나갔다
# (mailroom 구독자 명단이 인터넷에서 무인증으로 읽힘 — 운영 재현). 앱은 매칭된 라우트 기준으로 고치되,
# 이 규칙은 그 뒤에도 남긴다. 쿼리스트링은 보지 않는다(`^[^?]*`).
#   1) 첫 경로 구간에 퍼센트 인코딩      /%61pi/…  /v%31/…
#   2) 경로에 ';' (또는 %3B)
#   3) 경로에 '..' 구간 (또는 %2e%2e)     파일명 속의 'a..b' 는 통과한다
if ($request_uri ~ "^(/[^/?]*%|[^?]*(;|%3[bB]|/(\.|%2[eE])(\.|%2[eE])(/|\?|$)))") { return 404; }
