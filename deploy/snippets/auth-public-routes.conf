# auth.datasee.co.kr 이 내주는 경로 전부(2026-11-13). 이 호스트는 인터넷에 열려 있어 로그인·OIDC·거부 안내에
# 필요한 것만 남긴다. 관리 콘솔(SPA·/api/admin·/api/me)은 내부 전용 gatehouse.datasee.co.kr 로 옮겼다.
# 전에는 `location /` 가 gatehouse 전체를 내줘서 콘솔 화면 껍데기와 관리 API 가 공개 주소에 그대로 보였다.
location = /login            { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location = /callback         { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location = /logout           { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location = /healthz          { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location = /auth/denied      { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location = /internal/account { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location = /favicon.ico      { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location = /favicon.svg      { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
# OIDC provider(디스커버리·인가·토큰·기기 승인)와 그 interaction 화면
location ^~ /oidc/             { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }
location ^~ /oidc-interaction/ { include /etc/nginx/conf.d/snippets/gatehouse-proxy.conf; }

# 옛 콘솔 주소로 오면 새 주소로.
location ^~ /admin { return 302 https://gatehouse.datasee.co.kr$request_uri; }

# 첫 화면: 로그인만 하고 갈 곳을 안 정한 사람이 떨어지는 곳. 콘솔 껍데기 대신 안내만 보여 준다.
location = / {
  default_type text/html;
  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action https://auth.datasee.co.kr; base-uri 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  return 200 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Datasee 로그인</title><style>body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f6f7f9;color:#1f2328;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;max-width:440px;margin:16px}h1{font-size:20px;margin:0 0 12px}p{line-height:1.6;margin:8px 0;color:#4b5563}a.btn{display:inline-block;margin:12px 8px 0 0;padding:10px 16px;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none}a.sub{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:8px;border:1px solid #d1d5db;color:#374151;text-decoration:none}</style></head><body><div class="card"><h1>Datasee 통합 로그인</h1><p>이 주소는 사내 서비스의 로그인만 담당합니다. 사내 서비스는 VPN 에 연결한 뒤 포털에서 여세요.</p><a class="btn" href="https://in.datasee.co.kr/">사내 포털 열기</a><a class="sub" href="/logout">로그아웃</a></div></body></html>';
}

# 그 밖의 모든 경로(콘솔 SPA 파일, /api/…, /auth/verify 등)는 없다.
location / { return 404; }
