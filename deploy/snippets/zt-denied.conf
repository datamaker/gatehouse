# 주의: deploy/*.conf 는 nginx 가 전부 include 하므로 이 스니펫은 snippets/ 아래에 둔다(최상위 location 은 구문 오류).
# 제로트러스트 거부 안내. 앱의 nginx server 블록(lobby.conf 등)의 `location /` 에
# `error_page 403 = @zt_denied;` 를 더하고 아래 named location 을 같은 server 블록에 넣는다.
# gatehouse /auth/verify 가 403 을 돌려주면(기기 미등록·미준수) 사용자는 안내 페이지로 간다.
#
#   location / {
#     auth_request /_gatehouse/verify;
#     ...
#     error_page 401 = @login;
#     error_page 403 = @zt_denied;
#   }
#
location @zt_denied {
  # v·r 은 /auth/verify 가 준 실제 거부 사유(X-Auth-Denied, X-Auth-Denied-Reason). 안내 페이지는 공개 주소라
  # 거기서 다시 판정하면 공인 IP 로 보여 항상 "기기 없음"이 된다 — 그래서 여기서 넘긴다. rd 는 맨 뒤(원래 URL 의 & 를 삼킨다).
  return 302 https://auth.datasee.co.kr/auth/denied?v=$zt_denied_v&r=$zt_denied_r&rd=https://$host$request_uri;
}
