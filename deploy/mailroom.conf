# mailroom 뉴스레터 플랫폼 — 관리 UI. 화면(정적 SPA)만 gatehouse forward-auth 뒤에 둔다(2026-11-13,
# 제로트러스트 기록·차단용). /api/ 와 /v1/ 은 벽이 없다: CLI·MCP·연동이 API 키로 부르고 OIDC 콜백도 그 아래다.
# 구독자가 여는 추적·수신거부 링크는 여기가 아니라 mailroom-public.conf(:8443, mail.datasee.co.kr)로 나가지만,
# 같은 경로(/t /u /p /w /s /c /a)가 이 호스트로 와도 벽 없이 통과시킨다(미리보기·테스트 발송 링크).
server {
  listen 443 ssl;
  http2 on;
  server_name mailroom.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/mailroom.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mailroom.datasee.co.kr/privkey.pem;

  # 뉴스레터 본문과 CSV 가져오기가 커질 수 있다.
  client_max_body_size 50m;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header X-Forwarded-Host $host;   # 제로트러스트 기록·면제용(어느 앱인지)
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;   # 브라우저가 보낸 XFF 는 버린다 — 제로트러스트 기기 IP 사칭 방지
    proxy_set_header Content-Length "";
  }

  location ~ ^/(api|v1|t|u|p|w|s|c|a)/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream_open http://mailroom:9200;
    proxy_pass $upstream_open;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }

  location = /healthz {
    resolver 127.0.0.11 valid=10s;
    set $upstream_health http://mailroom:9200;
    proxy_pass $upstream_health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    # 바깥 벽(gatehouse forward-auth): 화면을 여는 요청마다 SSO 세션과 기기 상태(제로트러스트)를 본다.
    # 앱 안의 OIDC 로그인은 그대로 남는다 — 신원은 앱이, 기기 판정은 여기서.
    auth_request /_gatehouse/verify;
    error_page 401 = @login;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://mailroom:9200;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }
}
