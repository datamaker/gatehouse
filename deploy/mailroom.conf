# mailroom 뉴스레터 플랫폼 — 관리 UI. forward-auth 없음: mailroom 이 gatehouse OIDC 로
# 직접 로그인시키고, CLI/연동은 API 키를 쓴다. 구독자가 여는 추적·수신거부 링크는
# 여기가 아니라 mailroom-public.conf(:8443, mail.datasee.co.kr)로 나간다.
server {
  listen 443 ssl;
  http2 on;
  server_name mailroom.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/mailroom.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mailroom.datasee.co.kr/privkey.pem;

  # 뉴스레터 본문과 CSV 가져오기가 커질 수 있다.
  client_max_body_size 50m;

  location / {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://mailroom:9200;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }
}
