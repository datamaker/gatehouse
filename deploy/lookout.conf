# lookout error tracking. NO forward-auth here: lookout signs users in itself
# (gatehouse OIDC), and SDK ingest must keep working without a browser session.
# The raw port :9000 also stays published for existing DSNs.
server {
  listen 443 ssl;
  http2 on;
  server_name lookout.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/lookout.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lookout.datasee.co.kr/privkey.pem;

  client_max_body_size 20m;

  location / {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://lookout:9000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
