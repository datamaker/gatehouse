# lookout error tracking. 화면(정적 SPA)만 gatehouse forward-auth 뒤에 둔다(2026-11-13, 제로트러스트 기록·차단용).
# /api/ 는 벽이 없다: SDK 수집(/api/<projectId>/envelope/, DSN 키), 대시보드 API·CLI(JWT Bearer),
# OIDC 콜백이 전부 그 아래에 있고 브라우저 세션 없이도 돌아야 한다.
# The raw port :9000 also stays published for existing DSNs.
server {
  listen 443 ssl;
  http2 on;
  server_name lookout.datasee.co.kr;
  include /etc/nginx/conf.d/snippets/path-guard.conf;

  ssl_certificate /etc/letsencrypt/live/lookout.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lookout.datasee.co.kr/privkey.pem;

  client_max_body_size 20m;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header X-Forwarded-Host $host;   # 제로트러스트 기록·면제용(어느 앱인지)
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;   # 브라우저가 보낸 XFF 는 버린다 — 제로트러스트 기기 IP 사칭 방지
    proxy_set_header Content-Length "";
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream_api http://lookout:9000;
    proxy_pass $upstream_api;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /healthz {
    resolver 127.0.0.11 valid=10s;
    set $upstream_health http://lookout:9000;
    proxy_pass $upstream_health;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    # 바깥 벽(gatehouse forward-auth): 화면을 여는 요청마다 SSO 세션과 기기 상태(제로트러스트)를 본다.
    # 앱 안의 OIDC 로그인은 그대로 남는다 — 신원은 앱이, 기기 판정은 여기서.
    auth_request /_gatehouse/verify;
    error_page 401 = @login;
    error_page 403 = @zt_denied;   # 기기·앱 접근 거부 안내(gatehouse /auth/denied)

    resolver 127.0.0.11 valid=10s;
    set $upstream http://lookout:9000;
    proxy_pass $upstream;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }

  include /etc/nginx/conf.d/snippets/zt-denied.conf;
}
