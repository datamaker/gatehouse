# pgsearch (Meilisearch-compatible search + dashboard) behind gatehouse.
# pgsearch has NO API auth of its own, so everything requires a gatehouse session.
# Machine clients must send a gatehouse session cookie or be added later via
# a bypass token — the raw port is bound to 127.0.0.1 on the host.
server {
  listen 443 ssl;
  http2 on;
  server_name pgsearch.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/pgsearch.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pgsearch.datasee.co.kr/privkey.pem;

  location = /_gatehouse/verify {
    internal;
    proxy_pass http://gatehouse:9100/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location / {
    auth_request /_gatehouse/verify;
    error_page 401 = @login;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://pgsearch:7700;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }
}
