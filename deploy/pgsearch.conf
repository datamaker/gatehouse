# pgsearch. NO forward-auth wall: pgsearch signs users in itself
# (gatehouse OIDC, native member management) and machine clients use
# Meilisearch-style Bearer API keys. TLS termination only.
server {
  listen 443 ssl;
  http2 on;
  server_name pgsearch.datasee.co.kr;

  ssl_certificate /etc/letsencrypt/live/pgsearch.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pgsearch.datasee.co.kr/privkey.pem;

  location / {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://pgsearch:7700;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
