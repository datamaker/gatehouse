# 방문 기관 센서스 (census). gatehouse 의 deploy/ 로 옮겨 nginx 가 읽게 한다.
# nginx 는 census_default 네트워크에 붙어야 한다(docker-compose.tls.yml 의 networks).
server {
  listen 443 ssl;
  http2 on;
  server_name census.datasee.co.kr;
  include /etc/nginx/conf.d/snippets/path-guard.conf;

  ssl_certificate /etc/letsencrypt/live/census.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/census.datasee.co.kr/privkey.pem;

  client_max_body_size 2m;

  location = /_gatehouse/verify {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $gh_verify gatehouse:9100;
    proxy_pass http://$gh_verify/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header X-Forwarded-Host $host;   # 제로트러스트 기록·면제용(어느 앱인지)
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;   # 브라우저가 보낸 XFF 는 버린다 — 제로트러스트 기기 IP 사칭 방지
    proxy_set_header Content-Length "";
  }

  # 캐시바이 서비스(Lambda)가 부르는 조회 API. 사람 로그인이 아니라 앱의 API 키로 막는다.
  location /v1/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://census:9700;
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
    proxy_pass $upstream;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # 사내 포털(lobby) 상태 점검용. 앱 데이터는 없다.
  location = /healthz {
    resolver 127.0.0.11 valid=10s;
    set $upstream_health http://census:9700;
    proxy_pass $upstream_health;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
  }

  location / {
    auth_request /_gatehouse/verify;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    error_page 401 = @login;
    auth_request_set $zt_denied_v $upstream_http_x_auth_denied;          # 거부 사유를 안내 페이지로 넘긴다
    auth_request_set $zt_denied_r $upstream_http_x_auth_denied_reason;
    error_page 403 = @zt_denied;   # 기기·앱 접근 거부 안내(gatehouse /auth/denied)

    # 덮어쓴다(set) — 클라이언트가 보낸 X-Auth-* 는 앱까지 가지 못한다.
    proxy_set_header X-Auth-Email $auth_email;
    proxy_set_header X-Auth-Name $auth_name;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://census:9700;
    proxy_pass $upstream;
    proxy_set_header Cookie $app_cookie;   # SSO 세션 쿠키는 앱에 넘기지 않는다(00-maps.conf)
    include /etc/nginx/secrets/proxy-secret[.]conf;   # X-Proxy-Secret — 앱은 이 값이 맞을 때만 X-Auth-* 를 믿는다
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location @login {
    return 302 https://auth.datasee.co.kr/login?rd=https://$host$request_uri;
  }

  include /etc/nginx/conf.d/snippets/zt-denied.conf;
}
