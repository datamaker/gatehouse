# 공개 경로 전용 vhost.
#
# 왜 나눠야 하나: 오픈 픽셀·클릭 링크·수신거부·구독폼은 **구독자의 브라우저와 메일
# 클라이언트**가 부르는 주소다. 사내 VPN 뒤에 두면 발송한 메일의 링크가 전부 죽는다.
#
# 새 NLB 리스너는 필요 없다. opentunnel-nlb 의 TCP :443 이 이미 인스턴스 :8443 으로
# 오고 있고, TCP 패스스루라 SNI 가 nginx 까지 그대로 온다. gatehouse 는 :8443 의
# default_server 이므로, 여기처럼 server_name 을 명시한 블록을 같은 포트에 얹으면
# mail.datasee.co.kr 로 온 것만 이쪽으로 갈라진다.
# (Route53: mail.datasee.co.kr A alias → opentunnel-nlb, auth 와 같은 대상)
limit_req_zone $binary_remote_addr zone=mailroom_public:10m rate=20r/s;

server {
  listen 8443 ssl;
  http2 on;
  server_name mail.datasee.co.kr;

  ssl_certificate     /etc/letsencrypt/live/mail.datasee.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mail.datasee.co.kr/privkey.pem;

  # 추적 픽셀은 대량으로 들어온다 — IP 당 상한을 둔다.
  limit_req zone=mailroom_public burst=60 nodelay;
  limit_req_status 429;

  # 스캐너가 찔러대는 확장자는 앱까지 보내지 않는다 (auth-public.conf 와 같은 정책).
  location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|env|bak|backup|old|orig|save|swp|sql|sqlite|db|ini|conf(ig)?|log|yml|yaml|toml|pem|key|crt|csr|p12|xml|pwd|htpasswd|sh|bat|ps1|tar|gz|tgz|zip|rar|7z)([.~][\w.~]*)?$ {
    return 404;
  }

  # 공개해도 되는 경로만 화이트리스트.
  #   /t 추적, /u 수신거부, /p 구독정보변경, /w 웹에서보기, /s 구독폼, /c 구독확인
  location ~ ^/(t|u|p|w|s|c)/ {
    proxy_pass http://127.0.0.1:9200;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/public/ {
    proxy_pass http://127.0.0.1:9200;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SES 이벤트(SNS) 수신
  location /api/webhooks/ {
    proxy_pass http://127.0.0.1:9200;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / { return 404; }
}
